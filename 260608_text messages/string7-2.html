<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://i.dailymail.co.uk/i/html_modules/2024/jquery-3.7.1.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<style>
    body{
        margin: 20px 0px;
        padding:0px 0px 20px 0px;
        border-top: #191919 1px solid;
        border-bottom: #191919 1px solid;
        font-family: 'Inter', sans-serif;
        color: #191919;
        user-select: none;
    }
    h1{
        font-size: 18px;
        font-weight: 900;
        padding-top: 15px;
    }
    .message-image{
        margin: 10px 0;
        width: 100%;
        max-width: none;
        
    }
    .message-wrapper-left{
        display: flex;
        margin-bottom: 20px;
        justify-content: left;
        padding-right: 60px;
        position: relative;
    }
    .message-wrapper-right{
        display: flex;
        margin-bottom: 20px;
        justify-content: right;
        padding-left: 60px;
        position: relative;
    }
    .message-wrapper-left > div{
        background: #defcff;
        padding: 12px;
        box-shadow: 0px 2px 5px #c4c4c4;
        display: inline-block;
    }
    .message-wrapper-right > div{
        background: #deffdf;
        padding: 12px;
        box-shadow: 0px 2px 5px #c4c4c4;
        display: inline-block;
    }
    .message-text{
        font-weight: 400;
        font-size: 14px;
        line-height: 18px;
        margin: 0 0 3px 0;
    }
    .message-text span{
        background-color: #191919;
    }
    .message-time-left{
        font-weight: 600;
        font-size: 10px;
        line-height: 12px;
        margin: 0;
        position: absolute;
        transform: translate(73px, -5px);
        left: 0;
        opacity: 0.5;
    }
    .message-time-right{
        font-weight: 600;
        font-size: 10px;
        line-height: 12px;
        margin: 0;
        position: absolute;
        transform: translate(-67px, -5px);
        right: 0;
        opacity: 0.5;
    }
    .message-time-center{
        font-weight: 600;
        font-size: 10px;
        text-align: center;
        line-height: 12px;
        margin: 2;
        opacity: 0.5;
    }
    .message-name{
        font-weight: 900;
        font-size: 14px;
        line-height: 18px;
        margin: 0;
    }
    .message-name-victim{
    height: 20px;
    width: 60px;
    background-color: #000;
    margin: 0;
}

    .message-wrapper-left > .headshot{
        max-width: 50px;
        display: inline-flex;
        align-items: flex-start;
        height: 100%;
        margin-right: 10px;
    }
    .message-wrapper-right > .headshot{
        max-width: 50px;
        display: inline-flex;
        align-items: flex-end;
        height: 100%;
        margin-left: 10px;
    }


    .start{
        margin-bottom: 5px;
    }
    .middle{
        margin-bottom: 5px;
    }


    .middle img{
        opacity: 0;
    }
    .end img{
        opacity: 0;
    }  


    .start div{
        border-radius: 5px 5px 2px 2px;
    }
    .middle div{
        border-radius: 2px;
    }
    .end div{
        border-radius: 2px 2px 5px 5px;
    }
    .solo div{
        border-radius: 5px;
    }

    .mark_left{
        max-width: 20px;
        position: absolute;
        transform: translate(-30px, -20px);
        opacity: 1!important;
    }

    .mark_right{
        max-width: 20px;
        position: absolute;
        opacity: 1!important;
        bottom: 0;
        right: 0;
        transform: translate(-40px, 0px);

    }
</style>
<body>

<h1></h1>

<!-- ICON RIGHT for solo text-->
<div class="message-wrapper-right solo">
    <div>
        <p class="message-name">McKenna</p>
        <p class="message-text">I'm ready when you are (winking emoji with tongue out)</p>
        <img class="mark_right" src="images/mark_right.svg">
    </div>
    <img class="headshot" src="images/headshots-01.png"/>
</div>


<div class="message-wrapper-left solo">
    <img class="headshot" src="images/headshots-02.png"/>
    <div>
        <p class="message-name-victim"></p>
        <p class="message-text">I want you so bad rn</p>
        <!--<p class="message-time-left">00:00</p>-->
        <img class="mark_left" src="images/mark_left.svg">
    </div>
</div>

<div class="message-wrapper-right solo">
    <div>
        <p class="message-name">McKenna</p>
        <p class="message-text">Me too (sighing emoji)</p>
        <img class="mark_right" src="images/mark_right.svg">
    </div>
    <img class="headshot" src="images/headshots-01.png"/>
</div>


</body>

<script>
        (() => {
            setInterval(() => {
                window.parent.postMessage(
                    {
                        sentinel: 'amp',
                        type: 'embed-size',
                        height: document.body.scrollHeight,
                    },
                    '*'
                );
            }, 1000);
        })()


        varframes = document.getElementsByTagName('iframe');
        window.addEventListener('message', function (event) {
            for (vari = 0; i < frames.length; i++) {
                if (frames[i].contentWindow === event.source) {
                    if (event.data.data.height !== "undefined") {
                        jQuery(frames[i]).height(event.data.data.height);
                    }

                    console.log(event);
                    break;
                }
            }
        });
    </script>

</html>
